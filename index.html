<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f4ef">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <title>写真パズル</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="./puzzle.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <p class="eyebrow">PHOTO PUZZLE</p>
        <h1>写真を、解いてみよう。</h1>
        <p class="lead">自分の写真を36ピースのパズルにして遊べます。</p>
      </header>

      <section class="game" aria-label="写真パズル">
        <div class="photo-controls">
          <h2>写真を選ぶ</h2>
          <input id="photoFile" class="visually-hidden" type="file" accept="image/jpeg,image/png,image/webp" aria-label="パズルにする写真を選択">
          <button id="choosePhoto" class="primary-button" type="button">写真を選ぶ</button>
          <p class="privacy-note">選んだ写真はこの端末のブラウザ内で処理され、サーバーへ送信・保存されません。</p>
          <div id="photoPreview" class="preview-frame" hidden>
            <img id="previewImage" alt="選択した写真のプレビュー">
          </div>
          <p class="crop-note">プレビューと同じ写真全体を使い、縦横比を保って36ピースに分けます。</p>
          <p id="photoStatus" class="photo-status" role="status" aria-live="polite">JPEG、PNG、WebPの写真を選択してください（10MBまで）。</p>
          <button id="createPuzzle" class="primary-button create-button" type="button" disabled>この写真でパズルを作る</button>
        </div>

        <div id="puzzleSection" class="puzzle-section" hidden>
          <div class="game-heading">
            <div>
              <p class="eyebrow">YOUR PHOTO</p>
              <h2 id="puzzleTitle">あなたの写真</h2>
            </div>
            <span class="piece-count">6 × 6</span>
          </div>
          <div class="board-viewport">
            <div id="boardScroller" class="board-scroller" tabindex="0" role="region" aria-label="パズル盤。横長の写真では盤面内を左右にスクロールできます。">
              <div id="boardWrap" class="board-wrap">
                <div id="board" class="board" role="group" aria-label="36ピースのパズル盤"></div>
              </div>
            </div>
            <div id="celebrationParticles" class="celebration-particles" aria-hidden="true"></div>
          </div>
          <p id="boardScrollHint" class="board-scroll-hint" hidden>タイルを押しやすくするため、盤面内を左右にスクロールできます。</p>
          <p id="gameStatus" class="status" role="status" aria-live="polite"></p>
          <button id="restart" class="secondary-button" type="button">同じ写真でシャッフルし直す</button>
        </div>
      </section>
      <footer>写真がつながる、その瞬間を。</footer>
    </main>
  </body>
</html>
